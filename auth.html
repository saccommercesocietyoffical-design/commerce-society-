<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAC Commerce | Student Access</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#273b52,#101d2c 70%);color:#f7f5ed;font:16px system-ui,sans-serif;padding:20px}.card{width:min(100%,440px);background:#17293a;border:1px solid #526070;border-radius:20px;padding:30px;box-shadow:0 20px 65px #0005}img{display:block;width:92px;height:92px;object-fit:contain;margin:0 auto 12px}h1{text-align:center;font-size:25px;margin:0 0 8px}p{text-align:center;color:#cbd2d9;line-height:1.5}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;background:#263a4c;color:#fff;border:1px solid #526070}button,input{font:inherit;border-radius:9px;padding:12px;width:100%}button{cursor:pointer;border:0;background:#dfbd76;color:#102033;font-weight:700}.tabs button.active{background:#dfbd76;color:#102033}label{display:block;margin:13px 0 6px;font-size:14px}input{background:#0c1b29;border:1px solid #637487;color:#fff}input:focus{outline:2px solid #dfbd76}#message{min-height:2.5em;text-align:left;white-space:pre-line}a{color:#f1ce88}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}.note{font-size:13px}</style></head><body><main class="card"><img src="assets/school-logo.png.jpg" alt="School logo"><h1>SAC Commerce Society</h1><p>Student Sign In / Sign Up<br>ශිෂ්‍ය පිවිසුම / ලියාපදිංචිය</p><section id="auth-area"><div class="tabs"><button id="signin-tab" type="button" class="active">Sign In</button><button id="signup-tab" type="button">Sign Up</button></div><form id="auth-form"><div id="name-field" hidden><label for="full-name">Full name / සම්පූර්ණ නම</label><input id="full-name" maxlength="100" autocomplete="name"></div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button id="submit" style="margin-top:20px" type="submit">Sign In</button></form></section><section id="waiting" hidden><p id="waiting-text"></p><button id="signout" type="button">Sign Out</button></section><p id="message" role="status" aria-live="polite"></p><p class="note">New accounts require email confirmation and administrator approval.<br>අලුත් ගිණුම් සඳහා Admin අනුමැතිය අවශ්‍යයි.</p></main><script type="module" src="auth.js"></script></body></html>
